config:
  target: "{{ $processEnvironment.TARGET }}"
  pool: 50 # All HTTP requests from all virtual users will be sent over the same connections
  phases:
    - name: Ramp
      duration: 30
      arrivalRate: 1
      rampTo: 5
    - name: Plain
      duration: 60
      arrivalRate: 5
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "us5.datadoghq.com"
        prefix: "artillery."
        tags:
          - "test:rates"

scenarios:
  - name: Rates (/rates)
    flow:
      - get:
          url: '/rates'
